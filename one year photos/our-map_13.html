<style>
  :root{
    --paper: #FBFAFC;
    --paper-deep: #F0EDF5;
    --ink: #23324A;
    --ink-soft: #4B5B72;
    --plum: #7C5CBF;
    --plum-deep: #4F3480;
    --lilac: #B9A2E0;
    --line: rgba(35,50,74,0.18);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    overflow: hidden;
  }

  #map{
    position: absolute;
    inset: 0;
    background: var(--paper);
  }

  .leaflet-tile-pane{
    filter: saturate(60%) brightness(1.02);
  }

  /* ---- header ---- */
  .header{
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 500;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 22px 30px;
    pointer-events: none;
  }
  .header-inner{
    pointer-events: auto;
    background: rgba(246,239,226,0.88);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 20px;
    box-shadow: 0 4px 16px rgba(35,50,74,0.08);
  }
  .header h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .header p{
    margin: 3px 0 0;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--plum-deep);
    font-weight: 500;
  }

  .legend{
    pointer-events: auto;
    background: rgba(246,239,226,0.88);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    align-self: flex-start;
  }

  /* ---- custom pin ---- */
  .pin{
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .pin-mark{
    width: 26px;
    height: 26px;
    border-radius: 50% 50% 50% 0;
    background: var(--plum);
    border: 2px solid var(--paper);
    transform: rotate(-45deg);
    box-shadow: 0 2px 6px rgba(35,50,74,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .pin-mark span{
    transform: rotate(45deg);
    color: var(--paper);
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 11px;
  }
  .pin:hover .pin-mark{
    transform: rotate(-45deg) scale(1.12);
    background: var(--plum-deep);
  }
  .pin.active .pin-mark{
    background: var(--lilac);
    transform: rotate(-45deg) scale(1.15);
  }

  /* ---- side panel ---- */
  .panel-wrap{
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 400px;
    max-width: 92vw;
    z-index: 600;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    pointer-events: none;
  }
  .panel-wrap.open{
    transform: translateX(0);
    pointer-events: auto;
  }
  .panel{
    height: 100%;
    background: var(--paper);
    border-left: 1px solid var(--line);
    box-shadow: -8px 0 30px rgba(35,50,74,0.15);
    overflow-y: auto;
    padding: 0 0 40px;
  }

  .panel-close{
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    justify-content: flex-end;
    padding: 16px 18px 0;
    background: linear-gradient(var(--paper) 60%, transparent);
  }
  .panel-close button{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .panel-close button:hover{
    border-color: var(--ink-soft);
    color: var(--ink);
  }

  .panel-content{
    padding: 4px 32px 0;
  }

  .stamp{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 68px;
    height: 68px;
    border: 2px dashed var(--lilac);
    border-radius: 50%;
    color: var(--plum-deep);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-align: center;
    line-height: 1.3;
    transform: rotate(-8deg);
    margin-bottom: 14px;
    padding: 6px;
  }

  .panel h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 30px;
    margin: 0 0 4px;
    color: var(--ink);
    line-height: 1.15;
  }

  .panel .when{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--plum-deep);
    font-weight: 500;
    margin: 0 0 22px;
  }

  .photo-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .photo-grid .full{
    grid-column: 1 / -1;
  }
    .photo{
    aspect-ratio: 4 / 3;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--paper-deep);
    object-fit: cover;
    width: 100%;
    display: block;
    cursor: pointer;
  }

  .photo-wrap{
    position: relative;
    cursor: pointer;
  }

  .photo-wrap .play-icon{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    pointer-events: none;
  }

  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 26, 0.92);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .lightbox.open{
    display: flex;
  }
  .lightbox-content img,
  .lightbox-content video{
    max-width: 100%;
    max-height: 85vh;
    display: block;
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .lightbox-close{
    position: absolute;
    top: 20px;
    right: 24px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 3px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .lightbox-close:hover{
    border-color: #fff;
  }
  }
  .photo-placeholder{
    aspect-ratio: 4 / 3;
    border-radius: 3px;
    border: 1.5px dashed var(--line);
    background: var(--paper-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    padding: 6px;
  }

  .panel .story{
    font-size: 16px;
    line-height: 1.75;
    color: var(--ink);
  }
  .panel .story p{ margin: 0 0 14px; }

  .divider{
    border: none;
    border-top: 1px solid var(--line);
    margin: 26px 0;
  }

  .nav-buttons{
    display: flex;
    justify-content: space-between;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .nav-buttons button{
    background: transparent;
    border: none;
    padding: 8px 4px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .nav-buttons button:hover{
    color: var(--plum-deep);
  }

  .leaflet-control-attribution{
    font-family: 'Inter', sans-serif;
    font-size: 10px;
  }

  @media (max-width: 640px){
    .header{ padding: 14px 14px; }
    .header-inner{ padding: 10px 14px; }
    .header h1{ font-size: 18px; }
    .legend{ display: none; }
    .panel-content{ padding: 4px 22px 0; }
  }
</style>
</head>

  // =========================================================
  // You shouldn't need to touch anything below this line.
  // =========================================================

  document.getElementById('page-title').textContent = PAGE_TITLE;
  document.getElementById('page-subtitle').textContent = PAGE_SUBTITLE;

  const map = L.map('map', { zoomControl: false }).setView(MAP_CENTER, MAP_ZOOM);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Paste your free CARTO API key here (from carto.com/basemaps/apikey)
  const CARTO_API_KEY = "cb1_31sf_1_8d4fbde684c663067a0280bb";

  L.tileLayer('https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=' + CARTO_API_KEY, {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }).addTo(map);

  const panelWrap = document.getElementById('panelWrap');
  const panelName = document.getElementById('panelName');
  const panelDate = document.getElementById('panelDate');
  const panelStory = document.getElementById('panelStory');
  const panelPhotos = document.getElementById('panelPhotos');
  const stamp = document.getElementById('stamp');

  let markers = [];
  let currentIndex = 0;

  function buildIcon(number, active){
    return L.divIcon({
      className: '',
      html: `<div class="pin${active ? ' active' : ''}"><div class="pin-mark"><span>${number}</span></div></div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 30]
    });
  }

  function isVideo(src){
    return /\.(mp4|mov|webm|m4v)$/i.test(src);
  }

  const lightbox = document.getElementById('lightbox');
  const lightboxContent = document.getElementById('lightboxContent');
  const lightboxClose = document.getElementById('lightboxClose');

  function openLightbox(src, isVid){
    lightboxContent.innerHTML = '';
    if (isVid){
      const video = document.createElement('video');
      video.src = src;
      video.controls = true;
      video.autoplay = true;
      lightboxContent.appendChild(video);
    } else {
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      lightboxContent.appendChild(img);
    }
    lightbox.classList.add('open');
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lightboxContent.innerHTML = '';
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeLightbox();
  });

  function renderPhotos(photos){
    panelPhotos.innerHTML = '';
    if (!photos || photos.length === 0){
      for (let i = 0; i < 2; i++){
        const div = document.createElement('div');
        div.className = 'photo-placeholder';
        div.textContent = 'Add a photo';
        panelPhotos.appendChild(div);
      }
      return;
    }
    photos.forEach((src, i) => {
      const isLast = photos.length % 2 === 1 && i === photos.length - 1;
      const wrap = document.createElement('div');
      wrap.className = 'photo-wrap' + (isLast ? ' full' : '');

      if (isVideo(src)){
        const video = document.createElement('video');
        video.className = 'photo';
        video.src = src;
        video.muted = true;
        video.preload = 'metadata';
        video.onerror = function(){
          const div = document.createElement('div');
          div.className = 'photo-placeholder';
          div.textContent = 'Video not found: ' + src;
          wrap.replaceWith(div);
        };
        const playIcon = document.createElement('span');
        playIcon.className = 'play-icon';
        playIcon.textContent = '▶';
        wrap.appendChild(video);
        wrap.appendChild(playIcon);
        wrap.addEventListener('click', () => openLightbox(src, true));
      } else {
        const img = document.createElement('img');
        img.className = 'photo';
        img.src = src;
        img.alt = '';
        img.onerror = function(){
          const div = document.createElement('div');
          div.className = 'photo-placeholder';
          div.textContent = 'Photo not found: ' + src;
          wrap.replaceWith(div);
        };
        wrap.appendChild(img);
        wrap.addEventListener('click', () => openLightbox(src, false));
      }
      panelPhotos.appendChild(wrap);
    });
  }

  function openPanel(index){
    currentIndex = index;
    const loc = LOCATIONS[index];
    stamp.innerHTML = 'STOP<br>' + String(index + 1).padStart(2, '0');
    panelName.textContent = loc.name;
    panelDate.textContent = loc.date;
    panelStory.innerHTML = '<p>' + loc.story.split('\n\n').join('</p><p>') + '</p>';
    renderPhotos(loc.photos);
    panelWrap.classList.add('open');

    markers.forEach((m, i) => m.setIcon(buildIcon(i + 1, i === index)));
    map.panTo([loc.lat, loc.lng]);
  }

  function closePanel(){
    panelWrap.classList.remove('open');
    markers.forEach((m, i) => m.setIcon(buildIcon(i + 1, false)));
  }

  document.getElementById('closeBtn').addEventListener('click', closePanel);
  document.getElementById('prevBtn').addEventListener('click', () => {
    openPanel((currentIndex - 1 + LOCATIONS.length) % LOCATIONS.length);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    openPanel((currentIndex + 1) % LOCATIONS.length);
  });

  LOCATIONS.forEach((loc, i) => {
    const marker = L.marker([loc.lat, loc.lng], { icon: buildIcon(i + 1, false) }).addTo(map);
    marker.on('click', () => openPanel(i));
    markers.push(marker);
  });

  if (LOCATIONS.length > 0){
    const bounds = L.latLngBounds(LOCATIONS.map(l => [l.lat, l.lng]));
    map.fitBounds(bounds, { padding: [80, 80] });
  }

</script>
